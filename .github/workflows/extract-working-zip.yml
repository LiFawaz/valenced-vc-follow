name: Arrange and build VC Follow package

on:
  workflow_dispatch:
  push:
    paths:
      - "vc.follow.67.zip"
      - ".github/workflows/extract-working-zip.yml"
      - "plugins/com.lifawaz.vc-follow/manifest.json"
      - "plugins/com.lifawaz.vc-follow/js/index.js"

permissions:
  contents: write

# Serialize builds so parallel runs cannot overwrite the same ZIP/index or race on main.
concurrency:
  group: vc-follow-package-build
  cancel-in-progress: false

jobs:
  arrange-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Convert the checked-in plugin entry point to ESM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          plugin_dir = Path("plugins/com.lifawaz.vc-follow")
          manifest_path = plugin_dir / "manifest.json"
          source_path = plugin_dir / "js/index.js"
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("format") != 1 or manifest.get("id") != "com.lifawaz.vc-follow":
              raise SystemExit("Unexpected Valenced manifest format or plugin ID.")
          if manifest.get("dist", {}).get("script") != "index.js":
              raise SystemExit("Manifest dist.script must be index.js.")

          js = source_path.read_text().rstrip()
          prefix = "(function(e){Object.defineProperty(e,Symbol.toStringTag,{value:`Module`});"
          if js.startswith(prefix):
              js = "const __vcFollowModule = (function(){" + js[len(prefix):]
          elif js.startswith("({default:(function(){"):
              js = "const __vcFollowModule = (function(){" + js[len("({default:(function(){"):]
          elif not js.startswith("const __vcFollowModule = (function(){"):
              raise SystemExit("Unexpected JS wrapper; refusing an unverified rewrite.")

          marker = "return e.default=plugin("
          if marker in js:
              if js.count(marker) != 1:
                  raise SystemExit("Expected exactly one wrapped default plugin entry point.")
              js = js.replace(marker, "return plugin(", 1)

          suffix = "),e})({});"
          if js.endswith(suffix):
              js = js[:-len(suffix)] + ")})();\nexport default __vcFollowModule;\n"
          elif js.endswith("})()})"):
              js = js[:-len("})()})")] + "})();\nexport default __vcFollowModule;\n"
          elif not js.endswith("export default __vcFollowModule;\n"):
              raise SystemExit("Unexpected JS wrapper ending; refusing an unverified rewrite.")

          source_path.write_text(js)
          print("Converted source to a real ESM default export.")
          PY

      - name: Get official Valenced build template
        run: git clone --depth 1 https://github.com/Valenced/valenced-plugin-template.git valenced-template

      - name: Copy plugin into template
        run: cp -R plugins/com.lifawaz.vc-follow valenced-template/plugins/com.lifawaz.vc-follow

      - name: Install build dependencies
        working-directory: valenced-template
        run: bun install

      - name: Build with official Valenced plugin CLI
        working-directory: valenced-template
        run: bun run build com.lifawaz.vc-follow

      - name: Package compiled plugin and regenerate repository index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          import json
          import shutil
          import subprocess
          import tempfile

          root = Path(".")
          manifest_path = root / "plugins/com.lifawaz.vc-follow/manifest.json"
          source_manifest = json.loads(manifest_path.read_text())
          build_js = root / "valenced-template/plugins/com.lifawaz.vc-follow/build/js/index.js"
          if not build_js.is_file() or not build_js.stat().st_size:
              raise SystemExit("Official Valenced build did not produce build/js/index.js.")
          subprocess.run(["node", "--check", str(build_js)], check=True)

          artifact_name = f"{source_manifest['id']}@{source_manifest['version']}.zip"
          pool = root / "pool"
          pool.mkdir(exist_ok=True)
          artifact = pool / artifact_name
          with tempfile.TemporaryDirectory() as tmp:
              temp = Path(tmp)
              package_manifest = temp / "manifest.json"
              package_manifest.write_text(json.dumps(source_manifest, indent=2) + "\n")
              with ZipFile(artifact, "w", ZIP_DEFLATED) as z:
                  z.write(package_manifest, "manifest.json")
                  z.write(build_js, "index.js")
          with ZipFile(artifact) as z:
              if set(z.namelist()) != {"manifest.json", "index.js"}:
                  raise SystemExit(f"Unexpected artifact contents: {z.namelist()}")
              if json.loads(z.read("manifest.json")) != source_manifest:
                  raise SystemExit("Packaged manifest mismatch.")
              bundled = z.read("index.js")
              with tempfile.NamedTemporaryFile(suffix=".js") as f:
                  f.write(bundled)
                  f.flush()
                  subprocess.run(["node", "--check", f.name], check=True)

          artifact_bytes = artifact.read_bytes()
          digest = hashlib.sha256(artifact_bytes).hexdigest()
          base = "https://raw.githubusercontent.com/LiFawaz/valenced-vc-follow/main"
          index = {
              "format": 1,
              "name": "LiFawaz VC Follow",
              "description": "Valenced plugin repository for following a user between Discord voice channels.",
              "plugins": {
                  source_manifest["id"]: {
                      "name": source_manifest.get("name", ""),
                      "description": source_manifest.get("description", ""),
                      "author": source_manifest.get("author", ""),
                      "channels": {"latest": source_manifest["version"]},
                      "versions": {
                          source_manifest["version"]: {
                              "url": f"{base}/pool/{artifact_name}",
                              "sha256": digest,
                              "size": len(artifact_bytes),
                              "dependencies": source_manifest["dependencies"],
                          }
                      },
                  }
              },
          }
          (root / "index.json").write_text(json.dumps(index, indent=2) + "\n")
          print(f"Official Valenced build succeeded: {source_manifest['id']}@{source_manifest['version']}")
          print(f"Install artifact: {artifact} ({len(artifact_bytes)} bytes)")
          print(f"SHA-256: {digest}")
          PY

      - name: Commit built plugin files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add plugins pool index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build and publish VC Follow package"
          # Rebase generated package commit if another legitimate commit landed on main.
          git fetch origin main
          if ! git rebase origin/main; then
            # The repository index is generated by this build, so prefer this build's
            # index when a source commit and package build both changed it.
            if git diff --name-only --diff-filter=U | grep -qx 'index.json'; then
              git checkout --theirs index.json
              git add index.json
              GIT_EDITOR=true git rebase --continue
            else
              git rebase --abort
              exit 1
            fi
          fi
          git push origin HEAD:main

# Rebuild trigger: validation runs after this workflow completes.
