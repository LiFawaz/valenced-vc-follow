name: Arrange and validate VC Follow package

on:
  workflow_dispatch:
  push:
    paths:
      - "vc.follow.67.zip"
      - ".github/workflows/extract-working-zip.yml"

permissions:
  contents: write

jobs:
  arrange-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract, arrange, validate, and package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          import json
          import shutil
          import subprocess
          import tempfile

          repo = Path(".")
          outer_path = repo / "vc.follow.67.zip"
          if not outer_path.is_file():
              raise SystemExit("vc.follow.67.zip was not found in the repository root.")

          with ZipFile(outer_path) as outer:
              candidates = [
                  name for name in outer.namelist()
                  if name.lower().endswith(".zip") and not name.endswith("/")
              ]
              if len(candidates) != 1:
                  raise SystemExit(f"Expected exactly one nested ZIP; found: {candidates}")
              inner_bytes = outer.read(candidates[0])

          with tempfile.TemporaryDirectory() as temp_dir:
              temp = Path(temp_dir)
              inner_zip = temp / "inner.zip"
              inner_zip.write_bytes(inner_bytes)
              with ZipFile(inner_zip) as archive:
                  names = set(archive.namelist())
                  if "manifest.json" not in names or "index.js" not in names:
                      raise SystemExit(
                          "The inner package must contain manifest.json and index.js; "
                          f"found: {sorted(names)}"
                      )
                  for member in archive.infolist():
                      destination = (temp / "unpacked" / member.filename).resolve()
                      root = (temp / "unpacked").resolve()
                      if destination != root and root not in destination.parents:
                          raise SystemExit(f"Unsafe path in package: {member.filename}")
                  archive.extractall(temp / "unpacked")
              package_dir = temp / "unpacked"
              manifest = json.loads((package_dir / "manifest.json").read_text())
              if manifest.get("format") != 1:
                  raise SystemExit("Unsupported manifest format.")
              if manifest.get("id") != "com.lifawaz.vc-follow":
                  raise SystemExit(f"Unexpected plugin ID: {manifest.get('id')}")
              if manifest.get("version") != "1.0.0":
                  raise SystemExit(f"Unexpected plugin version: {manifest.get('version')}")
              deps = manifest.get("dependencies", {})
              for required in ("valenced.api", "discord"):
                  if required not in deps:
                      raise SystemExit(f"Missing required dependency: {required}")
              script = package_dir / "index.js"
              subprocess.run(["node", "--check", str(script)], check=True)

              plugin_dir = repo / "plugins/com.lifawaz.vc-follow"
              js_dir = plugin_dir / "js"
              js_dir.mkdir(parents=True, exist_ok=True)
              shutil.copy2(package_dir / "manifest.json", plugin_dir / "manifest.json")
              shutil.copy2(script, js_dir / "index.js")

              # The original TypeScript scaffold is not the code from the uploaded
              # package. Remove it to prevent ambiguous entry-point selection.
              old_ts = js_dir / "index.ts"
              if old_ts.exists():
                  old_ts.unlink()
              old_tsconfig = plugin_dir / "tsconfig.json"
              if old_tsconfig.exists():
                  old_tsconfig.unlink()

              # Create the installable ZIP with the exact expected top-level files.
              pool = repo / "pool"
              pool.mkdir(exist_ok=True)
              artifact_name = f"{manifest['id']}@{manifest['version']}.zip"
              artifact = pool / artifact_name
              with ZipFile(artifact, "w", ZIP_DEFLATED) as out:
                  out.write(plugin_dir / "manifest.json", "manifest.json")
                  out.write(js_dir / "index.js", "index.js")

              # Re-open the final artifact and validate its manifest and entry point.
              with ZipFile(artifact) as check:
                  if set(check.namelist()) != {"manifest.json", "index.js"}:
                      raise SystemExit(f"Unexpected package contents: {check.namelist()}")
                  packaged_manifest = json.loads(check.read("manifest.json"))
                  if packaged_manifest != manifest:
                      raise SystemExit("Packaged manifest does not match source manifest.")
                  packaged_script = temp / "packaged-index.js"
                  packaged_script.write_bytes(check.read("index.js"))
                  subprocess.run(["node", "--check", str(packaged_script)], check=True)

              artifact_bytes = artifact.read_bytes()
              sha256 = hashlib.sha256(artifact_bytes).hexdigest()
              base = "https://raw.githubusercontent.com/LiFawaz/valenced-vc-follow/main"
              index = {
                  "format": 1,
                  "name": "LiFawaz VC Follow",
                  "description": "Valenced plugin repository for following a user between Discord voice channels.",
                  "plugins": {
                      manifest["id"]: {
                          "name": manifest.get("name", ""),
                          "description": manifest.get("description", ""),
                          "author": manifest.get("author", ""),
                          "channels": {"latest": manifest["version"]},
                          "versions": {
                              manifest["version"]: {
                                  "url": f"{base}/pool/{artifact_name}",
                                  "sha256": sha256,
                                  "size": len(artifact_bytes),
                                  "dependencies": manifest["dependencies"],
                              }
                          },
                      }
                  },
              }
              (repo / "index.json").write_text(json.dumps(index, indent=2) + "\n")
              print(f"Validated {manifest['id']}@{manifest['version']}")
              print(f"JavaScript syntax: OK")
              print(f"Package: {artifact} ({len(artifact_bytes)} bytes)")
              print(f"SHA-256: {sha256}")
              print("Repository index regenerated.")

          # Remove temporary artifacts created by the previous workflow revision.
          shutil.rmtree(repo / "working-package", ignore_errors=True)
          shutil.rmtree(repo / "dist", ignore_errors=True)
          PY

      - name: Commit arranged files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A plugins pool index.json working-package dist
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Arrange and validate VC Follow plugin package"
            git push
          fi
