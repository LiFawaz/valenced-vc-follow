name: Validate Valenced VC Follow package

on:
  workflow_run:
    workflows: ["Arrange and build VC Follow package"]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate manifest and source module syntax
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < plugins/com.lifawaz.vc-follow/js/index.js
          node - <<'NODE'
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync("plugins/com.lifawaz.vc-follow/manifest.json", "utf8"));
          if (m.format !== 1 || m.id !== "com.lifawaz.vc-follow" || m.dist?.script !== "index.js" || !m.dependencies?.["valenced.api"] || !m.dependencies?.discord) process.exit(1);
          console.log("Manifest OK:", m.id, m.version);
          NODE

      - name: Get official Valenced build template
        run: git clone --depth 1 https://github.com/Valenced/valenced-plugin-template.git valenced-template

      - name: Copy plugin into template
        run: cp -R plugins/com.lifawaz.vc-follow valenced-template/plugins/com.lifawaz.vc-follow

      - name: Install build dependencies
        working-directory: valenced-template
        run: bun install

      - name: Build with official Valenced plugin CLI
        working-directory: valenced-template
        run: bun run build com.lifawaz.vc-follow

      - name: Verify built output, install ZIP, and repository index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import subprocess
          import tempfile

          root = Path(".")
          manifest = json.loads((root / "plugins/com.lifawaz.vc-follow/manifest.json").read_text())
          built = root / "valenced-template/plugins/com.lifawaz.vc-follow/build/js/index.js"
          assert built.is_file() and built.stat().st_size > 0, "official build output is missing"
          artifact = root / "pool" / f"{manifest['id']}@{manifest['version']}.zip"
          assert artifact.is_file(), f"installable ZIP is missing: {artifact}"

          with ZipFile(artifact) as z:
              assert set(z.namelist()) == {"manifest.json", "index.js"}, f"unexpected ZIP contents: {z.namelist()}"
              packed_manifest = json.loads(z.read("manifest.json"))
              assert packed_manifest == manifest, "ZIP manifest differs from source"
              packed_js = z.read("index.js")
              assert packed_js == built.read_bytes(), "ZIP JavaScript differs from official Valenced build"
              with tempfile.NamedTemporaryFile(suffix=".js") as f:
                  f.write(packed_js)
                  f.flush()
                  subprocess.run(["node", "--check", f.name], check=True)

          index = json.loads((root / "index.json").read_text())
          assert index.get("format") == 1, "unsupported repository index format"
          plugin = index.get("plugins", {}).get(manifest["id"])
          assert plugin, "plugin missing from repository index"
          version = plugin.get("versions", {}).get(manifest["version"])
          assert version, "plugin version missing from repository index"
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert version.get("sha256") == digest, "index SHA-256 does not match ZIP"
          assert version.get("size") == artifact.stat().st_size, "index ZIP size mismatch"
          assert version.get("url", "").endswith("/pool/" + artifact.name), "index URL mismatch"
          assert plugin.get("channels", {}).get("latest") == manifest["version"], "latest channel mismatch"
          print("Official Valenced build OK")
          print("Install ZIP matches official build")
          print("Repository index and SHA-256 OK:", digest)
          PY

      - name: Upload installable ZIP for convenience
        uses: actions/upload-artifact@v4
        with:
          name: com.lifawaz.vc-follow-installable-zip
          path: pool/com.lifawaz.vc-follow@*.zip
          if-no-files-found: error
          retention-days: 30
